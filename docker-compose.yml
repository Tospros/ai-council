version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ai-council-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicouncil123}
      POSTGRES_DB: ${POSTGRES_DB:-ai_council}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ai-council-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicouncil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-council-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicouncil}:${POSTGRES_PASSWORD:-aicouncil123}@db:5432/${POSTGRES_DB:-ai_council}
      POSTGRES_USER: ${POSTGRES_USER:-aicouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicouncil123}
      POSTGRES_DB: ${POSTGRES_DB:-ai_council}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      
      # Application
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      
      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-council-network
    volumes:
      # Dla development - hot reload
      # - ./app:/app/app
      # - ./front:/app/front
      - ./logs:/app/logs

  # pgAdmin (opcjonalnie - do zarządzania bazą)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-council-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aicouncil.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - ai-council-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ai-council-network:
    driver: bridge
