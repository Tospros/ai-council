<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Red Team{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff006e;
            --neon-cyan: #00f5ff;
            --neon-purple: #bf00ff;
            --neon-green: #39ff14;
            --neon-orange: #ff6b35;
            --neon-yellow: #ffff00;
            --dark-bg: #0a0a0f;
            --card-bg: #12121a;
            --card-border: #1e1e2e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            background-image:
                radial-gradient(ellipse at top left, rgba(191, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0f 0%, #0f0f1a 100%);
            color: #ffffff !important;
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }

        /* Force white text everywhere */
        p, span, div, label, small, td, th, li, a {
            color: #ffffff !important;
        }

        a:hover {
            color: var(--neon-cyan) !important;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .navbar {
            background: linear-gradient(135deg, rgba(18, 18, 26, 0.95) 0%, rgba(30, 30, 46, 0.95) 100%) !important;
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            letter-spacing: 2px;
        }

        .nav-link {
            color: #ffffff !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--neon-cyan) !important;
            text-shadow: 0 0 20px var(--neon-cyan);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--neon-cyan);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .card {
            background: linear-gradient(145deg, var(--card-bg) 0%, #1a1a2e 100%);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--neon-cyan);
            box-shadow:
                0 0 30px rgba(0, 245, 255, 0.2),
                0 10px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .card-header {
            background: linear-gradient(90deg, rgba(0, 245, 255, 0.1) 0%, rgba(191, 0, 255, 0.1) 100%);
            border-bottom: 1px solid var(--card-border);
            padding: 1.2rem 1.5rem;
        }

        .card-header h5 {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            color: var(--neon-cyan);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-body {
            padding: 1.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            border: none;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 30px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-pink) 100%);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.6);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--neon-cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--card-border);
            color: #ffffff;
            border-radius: 10px;
            padding: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--neon-cyan);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-label {
            color: var(--neon-cyan);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .model-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 8px 15px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin: 2px;
        }

        .smollm-135, .smollm {
            background: linear-gradient(135deg, #00f5ff 0%, #0099ff 100%);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }
        .smollm-360 {
            background: linear-gradient(135deg, #bf00ff 0%, #8000ff 100%);
            color: #fff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.5);
        }
        .tinyllama {
            background: linear-gradient(135deg, #39ff14 0%, #00cc00 100%);
            color: #000;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }

        .rating-stars {
            font-size: 2rem;
            cursor: pointer;
        }

        .rating-stars .star {
            color: #333;
            transition: all 0.2s ease;
            text-shadow: none;
        }

        .rating-stars .star.active,
        .rating-stars .star:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 20px var(--neon-yellow);
        }

        pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 1.2rem;
            border-radius: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border: 1px solid var(--card-border);
        }

        .prompt-box {
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.1) 0%, rgba(191, 0, 255, 0.1) 100%);
            border-left: 4px solid var(--neon-pink);
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-radius: 0 10px 10px 0;
        }

        .response-box {
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.1) 0%, rgba(0, 245, 255, 0.1) 100%);
            border-left: 4px solid var(--neon-green);
            padding: 1.2rem;
            border-radius: 0 10px 10px 0;
        }

        .list-group-item {
            background: transparent;
            border: 1px solid var(--card-border);
            color: #ffffff;
            transition: all 0.3s ease;
            margin-bottom: 5px;
            border-radius: 8px !important;
        }

        .list-group-item:hover {
            background: rgba(0, 245, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: translateX(5px);
        }

        .list-group-item p {
            color: #ffffff;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .card-body, .card-body * {
            color: #ffffff !important;
        }

        .card-body h6 {
            color: var(--neon-cyan) !important;
        }

        pre, pre * {
            color: #ffffff !important;
        }

        textarea, input {
            color: #ffffff !important;
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.2) 0%, rgba(0, 200, 0, 0.2) 100%);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2) 0%, rgba(255, 0, 0, 0.2) 100%);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2) 0%, rgba(0, 150, 255, 0.2) 100%);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* Glowing text effects */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', monospace;
        }

        .display-4 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Spinner animation */
        .spinner-border {
            border-color: var(--neon-cyan);
            border-right-color: transparent;
        }

        /* Table styles */
        .table-dark {
            background: transparent;
            color: #ffffff;
        }

        .table-dark th {
            background: rgba(0, 245, 255, 0.1);
            color: var(--neon-cyan);
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-color: var(--card-border);
        }

        .table-dark td {
            border-color: var(--card-border);
            color: #ffffff;
        }

        .table-hover tbody tr:hover {
            background: rgba(0, 245, 255, 0.05);
        }

        /* Progress bar */
        .progress {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--card-border);
            margin-top: 50px;
        }

        footer small {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-pink);
        }

        /* Animations */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 245, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 245, 255, 0.6); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .glow-effect {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                &#9889; LLM RED TEAM
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'index' %}">Home</a>
                <a class="nav-link" href="{% url 'stats' %}">Statistics</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-4 mt-5">
        <small>
            &#9889; LLM RED TEAM // AI SECURITY RESEARCH TOOL &#9889;
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
