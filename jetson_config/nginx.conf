server {
    listen 8000;

    # duże prompty / odpowiedzi
    client_max_body_size 50m;

    # trochę bardziej "ollama-friendly" timeouty
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Llama
    location ~* ^/llama(/.*)?$ {
        rewrite ^/llama/?(.*)$ /$1 break;
        proxy_pass http://ollama-llama:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Mistral
    location ~* ^/mistral(/.*)?$ {
        rewrite ^/mistral/?(.*)$ /$1 break;
        proxy_pass http://ollama-mistral:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Gemma
    location ~* ^/gemma(/.*)?$ {
        rewrite ^/gemma/?(.*)$ /$1 break;
        proxy_pass http://ollama-gemma:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # pomocniczo
    location = / {
        default_type text/plain;
        return 200 "Ollama reverse proxy OK. Use /llama/*, /mistral/*, /gemma/*\n";
    }

    location / {
        default_type text/plain;
        return 404 "Unknown route. Use /llama/*, /mistral/*, /gemma/*\n";
    }
}
