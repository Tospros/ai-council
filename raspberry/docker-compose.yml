version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8081:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-/api}
    networks:
      - ai-council-network

  backend:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://council_user:pass123@postgres:5432/ai_council
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MODEL_NAME_1=${MODEL_NAME_1:-llama3.2:1b}
      - MODEL_NAME_2=${MODEL_NAME_2:-mistral:7b}
      - MODEL_NAME_3=${MODEL_NAME_3:-gemma:2b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-council-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: itsasecret
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
      - './docker/database:/docker-entrypoint-initdb.d'
    networks:
      - ai-council-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-council-network

networks:
  ai-council-network:
    driver: bridge

volumes:
  pgdata:
