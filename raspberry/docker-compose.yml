version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8081:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-/api}
    networks:
      - ai-council-network

  backend:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - docker/.env
    networks:
      - ai-council-network
    
  postgres:
    profiles: ["stack"]
    container_name: postgres
    hostname: postgres
    image: postgres:12-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: itsasecret
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
      - './docker/database:/docker-entrypoint-initdb.d'

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-council-network

networks:
  ai-council-network:
    driver: bridge

volumes:
  models_cache:
  pgdata:
