version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8081:80"
    environment:
      - API_BASE_URL=/api
    depends_on:
      - backend
    networks:
      - ai-council-network

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_API_URL=http://llm-api:8080
    depends_on:
      - llm-api
    networks:
      - ai-council-network

  llm-api:
    build: ./ollama-models-with-api
    ports:
      - "8080:8080"
    environment:
      - TRANSFORMERS_CACHE=/app/models_cache
    volumes:
      - models_cache:/app/models_cache
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    networks:
      - ai-council-network

networks:
  ai-council-network:
    driver: bridge

volumes:
  models_cache:
