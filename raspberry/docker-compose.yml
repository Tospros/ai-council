version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8081:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://host.docker.internal:8000}
    networks:
      - ai-council-network

  backend:
    profiles: ["stack"]
    build: 
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_API_URL=http://llm-api:8080
    depends_on:
      - llm-api
      - postgres
    env_file:
      - docker/.env
    networks:
      - ai-council-network
    command: ["./wait-for", "postgres:5432", "--", "/ai-council/backend"]
    
  postgres:
    profiles: ["stack"]
    container_name: postgres
    hostname: postgres
    image: postgres:12-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: itsasecret
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
      - './docker/database:/docker-entrypoint-initdb.d'

  llm-api:
    profiles: ["stack"]
    build: ./ollama-models-with-api
    ports:
      - "8080:8080"
    environment:
      - TRANSFORMERS_CACHE=/app/models_cache
    volumes:
      - models_cache:/app/models_cache
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    networks:
      - ai-council-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-council-network

networks:
  ai-council-network:
    driver: bridge

volumes:
  models_cache:
  pgdata:
