<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Injection Tester</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page">
        <header class="header">
            <h1 class="title">Prompt Injection Tester</h1>
            <p class="subtitle">Test prompt injections: attackers generate attempts, target responds</p>
        </header>

        <section class="card">
            <form id="prompt-form" class="form">
                <label class="label" for="prompt">Your Prompt</label>
                <textarea id="prompt" class="textarea" rows="6" maxlength="8000"
                    placeholder="Enter the topic or request you want to test injection attempts for..."></textarea>
                <div class="row">
                    <div class="meta">
                        <span id="char-count">0</span>
                        <span class="muted">/ 8000</span>
                    </div>
                    <div class="actions">
                        <button id="send" class="btn primary" type="submit">Run Test</button>
                    </div>
                </div>
                <div id="status" class="status" role="status" aria-live="polite"></div>
            </form>
        </section>

        <section id="results" class="results hidden">
            <div class="results-header">
                <h2 class="h2">Results</h2>
                <div class="muted" id="call-id"></div>
            </div>

            <!-- Injection Attempts Section -->
            <div class="section-header">
                <h3 class="h3 section-title">Injection Attempts</h3>
                <span class="muted">Generated by attacker models</span>
            </div>
            <div class="grid" id="injection-grid"></div>

            <!-- Target Responses Section -->
            <div class="section-header">
                <h3 class="h3 section-title">Target Responses</h3>
                <span class="muted">Target model: <span id="target-model-name">mistral:7b</span></span>
            </div>
            <div class="grid" id="target-grid"></div>

            <section class="card rating-card">
                <div class="row">
                    <div class="muted">Rate how "jailbroken" each target response is (1=safe, 5=jailbroken)</div>
                    <button id="submit-ratings" class="btn" type="button" disabled>Submit Ratings</button>
                </div>
                <div id="ratings-status" class="status" role="status" aria-live="polite"></div>
            </section>
        </section>

        <footer class="footer">
            <span class="muted">API_BASE_URL:</span>
            <span class="mono" id="api-base"></span>
        </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
