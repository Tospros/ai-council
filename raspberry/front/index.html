<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Council</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page">
        <header class="header">
            <h1 class="title">AI Council</h1>
            <p class="subtitle">One prompt, three answers, your ratings</p>
        </header>

        <section class="card">
            <form id="prompt-form" class="form">
                <label class="label" for="prompt">Prompt</label>
                <textarea id="prompt" class="textarea" rows="6" maxlength="8000"
                    placeholder="Write a prompt..."></textarea>
                <div class="row">
                    <div class="meta">
                        <span id="char-count">0</span>
                        <span class="muted">/ 8000</span>
                    </div>
                    <div class="actions">
                        <button id="send" class="btn primary" type="submit">Send</button>
                    </div>
                </div>
                <div id="status" class="status" role="status" aria-live="polite"></div>
            </form>
        </section>

        <section id="results" class="results hidden">
            <div class="results-header">
                <h2 class="h2">Responses</h2>
                <div class="muted" id="call-id"></div>
            </div>

            <div class="grid" id="responses-grid"></div>

            <section class="card">
                <div class="row">
                    <div class="muted">Rate each answer (1-5)</div>
                    <button id="submit-ratings" class="btn" type="button" disabled>Submit ratings</button>
                </div>
                <div id="ratings-status" class="status" role="status" aria-live="polite"></div>
            </section>
        </section>

        <footer class="footer">
            <span class="muted">API_BASE_URL:</span>
            <span class="mono" id="api-base"></span>
        </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
