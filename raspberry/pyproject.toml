[project]
name = "ai-council-backend"
version = "0.1.0"
description = "Backend dla AI Council - proxy do modeli LLM"
authors = [
    {name = "Antoni Zgajewski",email = "antek004@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.124.0,<0.125.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "databases[postgresql] (>=0.9.0,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
