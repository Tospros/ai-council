version: "3.8"

services:
  ollama-llama:
    image: ollama/ollama:latest
    container_name: ollama-llama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_llama:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      ollama pull llama3.2:latest
      exec ollama serve

  ollama-mistral:
    image: ollama/ollama:latest
    container_name: ollama-mistral
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_mistral:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      ollama pull mistral:latest
      exec ollama serve

  ollama-gemma:
    image: ollama/ollama:latest
    container_name: ollama-gemma
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_gemma:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      ollama pull gemma2:2b
      exec ollama serve

volumes:
  ollama_llama:
  ollama_mistral:
  ollama_gemma:
